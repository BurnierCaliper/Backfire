<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图标草稿</title>
<style>
:root {
  --bg-0: #07090d;
  --bg-1: #0d1117;
  --panel: #111821;
  --line: #1f2a36;
  --text: #e6edf3;
  --muted: #7d8b99;
  --cyan: #3ef0ff;
  --magenta: #ff3e9a;
  /* 属性：保留游戏里的色相，提亮成霓虹色 */
  --fire: #ff5a4a;
  --acid: #8dff4a;
  --electric: #ffe14a;
  --ice: #7fd8ff;
  --energy: #2fffd6;
  --physical: #ffa04a;
  --harmonic: #c27cff;
  /* 节点 */
  --n-battle: #e6edf3;
  --n-elite: #ff7a3e;
  --n-boss: #ff3e5e;
  --n-rest: #3ef0ff;
  --n-shop: #ffd23e;
  --n-smith: #ffa04a;
  --n-clinic: #5effa0;
  --n-check: #c27cff;
  --n-ambush: #ff3e9a;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg-0); color: var(--text);
  font: 14px/1.6 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background-image:
    linear-gradient(rgba(62,240,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(62,240,255,.035) 1px, transparent 1px);
  background-size: 24px 24px;
}
main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 22px; letter-spacing: .12em; margin: 0 0 4px; }
h1 small { font-size: 12px; color: var(--cyan); letter-spacing: .3em; margin-left: 10px; }
.lead { color: var(--muted); margin: 0 0 28px; }
h2 {
  font-size: 13px; letter-spacing: .3em; color: var(--cyan); margin: 36px 0 14px;
  display: flex; align-items: center; gap: 12px;
}
h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
h3 { font-size: 14px; margin: 18px 0 10px; color: var(--muted); font-weight: 500; letter-spacing: .1em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.cell { text-align: center; font-size: 12px; color: var(--muted); }
.cell b { display: block; color: var(--text); font-weight: 500; font-size: 13px; margin-top: 6px; }

/* ---------- 风格 A：霓虹线框 ---------- */
.a-tile {
  position: relative; width: 84px; height: 84px; margin: 0 auto;
  display: grid; place-items: center; color: var(--c);
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 10%, transparent), transparent 70%);
}
.a-tile::before, .a-tile::after {
  content: ""; position: absolute; width: 14px; height: 14px; border: 1.5px solid var(--c); opacity: .7;
}
.a-tile::before { left: 0; top: 0; border-right: 0; border-bottom: 0; }
.a-tile::after { right: 0; bottom: 0; border-left: 0; border-top: 0; }
.a-tile svg { width: 52px; height: 52px; filter: drop-shadow(0 0 4px var(--c)) drop-shadow(0 0 10px color-mix(in srgb, var(--c) 50%, transparent)); }

/* ---------- 风格 B：实心切角 ---------- */
.b-tile {
  width: 84px; height: 84px; margin: 0 auto; display: grid; place-items: center;
  color: #0a0d12;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 100%, #fff 20%), color-mix(in srgb, var(--c) 70%, #000 30%));
  clip-path: polygon(18% 0, 100% 0, 100% 82%, 82% 100%, 0 100%, 0 18%);
  position: relative;
}
.b-tile::after {
  content: ""; position: absolute; inset: 3px;
  clip-path: inherit; border: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 4px);
  pointer-events: none;
}
.b-tile svg { width: 50px; height: 50px; }

svg.ic { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linejoin: miter; stroke-linecap: square; }
.b-tile svg.ic { stroke-width: 3.2; }
svg.ic .solid { fill: currentColor; stroke: none; }
svg.ic .thin { stroke-width: 1.6; opacity: .65; }

/* ---------- 小尺寸 ---------- */
.sizes { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; }
.sizes .row { display: flex; gap: 10px; align-items: center; }
.sizes svg { color: var(--c); }
.sizes .lab { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* ---------- 路线图 ---------- */
.map-wrap { display: grid; grid-template-columns: minmax(0, 420px) 1fr; gap: 28px; align-items: start; }
@media (max-width: 760px) { .map-wrap { grid-template-columns: 1fr; } }
.map {
  position: relative; background: linear-gradient(180deg, #0b1220, #070a10 60%, #0b0f16);
  border: 1px solid var(--line); overflow: hidden;
}
.map::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(62,240,255,.035) 0 1px, transparent 1px 3px);
}
.map > svg { display: block; width: 100%; height: auto; }
.map .edge { stroke: #2a3a4c; stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; fill: none; }
.map .edge.done { stroke: var(--cyan); stroke-dasharray: none; opacity: .45; }
.map .edge.next { stroke: var(--cyan); stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.map .node .ring { fill: #0b1119; stroke: var(--c); stroke-width: 1.6; }
.map .node.done .ring { fill: color-mix(in srgb, var(--c) 18%, #0b1119); opacity: .55; }
.map .node.done use { opacity: .45; }
.map .node.now .ring { stroke-width: 2.4; filter: drop-shadow(0 0 6px var(--c)); }
.map .node.now .pulse { fill: none; stroke: var(--c); stroke-width: 1.5; animation: pulse 1.6s ease-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes pulse { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
.map .node.later { opacity: .8; }
.map .node use { color: var(--c); }
.map .label { fill: var(--muted); font-size: 10px; letter-spacing: .2em; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; }
.legend div { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.legend svg { width: 26px; height: 26px; color: var(--c); filter: drop-shadow(0 0 3px var(--c)); flex: none; }
.legend b { color: var(--text); font-weight: 500; }
.note { color: var(--muted); font-size: 13px; border-left: 2px solid var(--cyan); padding: 6px 12px; background: rgba(62,240,255,.04); }
@media (prefers-reduced-motion: reduce) { .map .edge.next, .map .node.now .pulse { animation: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- ============ 节点 ============ -->
    <symbol id="n-battle" viewBox="0 0 48 48">
      <path d="M11 11 L33 33 M27 37 L37 27 M33 33 L39 39"/>
      <path d="M37 11 L15 33 M11 27 L21 37 M15 33 L9 39"/>
      <path class="thin" d="M11 11 L15 11 M11 11 L11 15 M37 11 L33 11 M37 11 L37 15"/>
    </symbol>
    <symbol id="n-elite" viewBox="0 0 48 48">
      <path d="M8 12 L16 21 L24 16 L32 21 L40 12 L37 31 L24 40 L11 31 Z"/>
      <path d="M17 27 L22 28 M31 27 L26 28"/>
      <path class="thin" d="M24 21 L24 33"/>
    </symbol>
    <symbol id="n-boss" viewBox="0 0 48 48">
      <path d="M24 5 L40.5 14.5 L40.5 33.5 L24 43 L7.5 33.5 L7.5 14.5 Z"/>
      <path d="M13 24 Q24 13 35 24 Q24 35 13 24 Z"/>
      <circle class="solid" cx="24" cy="24" r="3.6"/>
      <path class="thin" d="M24 9 L24 13 M24 35 L24 39"/>
    </symbol>
    <symbol id="n-rest" viewBox="0 0 48 48">
      <path d="M6 38 L42 38"/>
      <path d="M10 38 L24 15 L38 38"/>
      <path d="M19 38 L24 29 L29 38"/>
      <path class="thin" d="M34 8 A5 5 0 1 0 40 15 A6.5 6.5 0 0 1 34 8 Z"/>
    </symbol>
    <symbol id="n-shop" viewBox="0 0 48 48">
      <path d="M24 7 L39 15.5 L39 32.5 L24 41 L9 32.5 L9 15.5 Z"/>
      <path d="M9 15.5 L24 24 L39 15.5 M24 24 L24 41"/>
      <path class="thin" d="M16.5 11.3 L31.5 19.8"/>
    </symbol>
    <symbol id="n-smith" viewBox="0 0 48 48">
      <path d="M13 37 L27 23"/>
      <path d="M23 11 L37 25 L41 21 L27 7 Z"/>
      <path class="thin" d="M7 25 L12 25 M11 13 L14.5 16.5 M19 5 L19 10"/>
      <path d="M8 42 L18 42"/>
    </symbol>
    <symbol id="n-clinic" viewBox="0 0 48 48">
      <path d="M16 6 H32 L42 16 V32 L32 42 H16 L6 32 V16 Z"/>
      <path d="M24 14 V34 M14 24 H34" style="stroke-width:4.2"/>
    </symbol>
    <symbol id="n-check" viewBox="0 0 48 48">
      <path d="M24 5 L40.5 14.5 L40.5 33.5 L24 43 L7.5 33.5 L7.5 14.5 Z"/>
      <path d="M24 13 L34 30 H14 Z"/>
      <path class="thin" d="M24 5 L24 13 M40.5 33.5 L34 30 M7.5 33.5 L14 30 M7.5 14.5 L24 13 L40.5 14.5"/>
    </symbol>
    <symbol id="n-ambush" viewBox="0 0 48 48">
      <path d="M24 6 L43 39 H5 Z"/>
      <path d="M24 18 V29" style="stroke-width:3.4"/>
      <rect class="solid" x="22.2" y="32" width="3.6" height="3.6"/>
    </symbol>
    <symbol id="n-start" viewBox="0 0 48 48">
      <path d="M12 42 V7"/>
      <path d="M12 9 H36 L30 16 L36 23 H12"/>
    </symbol>

    <!-- ============ 属性 ============ -->
    <symbol id="e-fire" viewBox="0 0 48 48">
      <path d="M24 5 C31 13 37 18 37 28 A13 13 0 0 1 11 28 C11 21 15 17 18 13 C19 19 22 21 24 21 C22 15 22 10 24 5 Z"/>
      <path class="thin" d="M24 38 A5 5 0 0 1 19 33 C19 30 22 28 24 24 C26 28 29 30 29 33 A5 5 0 0 1 24 38 Z"/>
    </symbol>
    <symbol id="e-acid" viewBox="0 0 48 48">
      <path d="M24 6 C24 6 11 22 11 30 A13 13 0 0 0 37 30 C37 22 24 6 24 6 Z"/>
      <circle cx="20" cy="31" r="3.2"/>
      <circle class="thin" cx="28.5" cy="35" r="2"/>
      <circle class="thin" cx="39" cy="9" r="2.2"/>
      <circle class="thin" cx="34" cy="14" r="1.2"/>
    </symbol>
    <symbol id="e-electric" viewBox="0 0 48 48">
      <path d="M28 4 L12 27 H23 L19 44 L36 19 H25 Z"/>
      <path class="thin" d="M6 14 L10 14 M38 32 L42 32 M40 26 L43 26"/>
    </symbol>
    <symbol id="e-ice" viewBox="0 0 48 48">
      <g id="ice-arm"><path d="M24 5 V43 M18.5 10 L24 15 L29.5 10 M18.5 38 L24 33 L29.5 38"/></g>
      <use href="#ice-arm" transform="rotate(60 24 24)"/>
      <use href="#ice-arm" transform="rotate(-60 24 24)"/>
    </symbol>
    <symbol id="e-energy" viewBox="0 0 48 48">
      <ellipse cx="24" cy="24" rx="19" ry="7.5" transform="rotate(30 24 24)"/>
      <ellipse cx="24" cy="24" rx="19" ry="7.5" transform="rotate(-30 24 24)"/>
      <ellipse class="thin" cx="24" cy="24" rx="19" ry="7.5" transform="rotate(90 24 24)"/>
      <circle class="solid" cx="24" cy="24" r="4.2"/>
    </symbol>
    <symbol id="e-physical" viewBox="0 0 48 48">
      <path d="M24.0 5.0 L27.1 16.6 L37.4 10.6 L31.4 20.9 L43.0 24.0 L31.4 27.1 L37.4 37.4 L27.1 31.4 L24.0 43.0 L20.9 31.4 L10.6 37.4 L16.6 27.1 L5.0 24.0 L16.6 20.9 L10.6 10.6 L20.9 16.6 Z"/>
      <rect class="solid" x="21" y="21" width="6" height="6" transform="rotate(45 24 24)"/>
    </symbol>
    <symbol id="e-harmonic" viewBox="0 0 48 48">
      <path d="M5 24 C9 12 13 12 17 24 C21 36 25 36 29 24 C33 12 37 12 41 24 L43 24"/>
      <path class="thin" d="M5 15 C9 9 13 9 17 15 C21 21 25 21 29 15 C33 9 37 9 41 15"/>
      <path class="thin" d="M5 33 C9 27 13 27 17 33 C21 39 25 39 29 33 C33 27 37 27 41 33"/>
    </symbol>
  </defs>
</svg>

<main>
  <h1>角鳞：四幕 · 图标草稿 <small>ICON DRAFT v1</small></h1>
  <p class="lead">科幻、潮流方向的第一版：同一套图形，做了两种外框风格给你对比。图标全是 SVG 线条，任意缩放不糊，颜色可以随时改。</p>

  <h2>风格 A · 霓虹线框</h2>
  <h3>路线节点</h3>
  <div class="grid" id="a-nodes"></div>
  <h3>七种属性</h3>
  <div class="grid" id="a-elems"></div>

  <h2>风格 B · 实心切角</h2>
  <h3>路线节点</h3>
  <div class="grid" id="b-nodes"></div>
  <h3>七种属性</h3>
  <div class="grid" id="b-elems"></div>

  <h2>小尺寸可读性</h2>
  <p class="note">游戏里属性图标常要缩到 16–24px（伤害弹字、技能按钮、日志），这里看缩小后还认不认得出。</p>
  <div class="sizes" id="sizes"></div>

  <h2>路线图示意</h2>
  <div class="map-wrap">
    <div class="map"><svg id="map" viewBox="0 0 400 600" role="img" aria-label="路线图示意"></svg></div>
    <div>
      <p class="note">类似《杀戮尖塔》：从下往上走，每一层选一条连线前进。走过的节点变暗，当前所在节点脉冲发光，下一步能去的连线会流动。这只是样式示意，路线怎么生成（分几条岔路、每层几种节点）之后再定。</p>
      <h3>图例</h3>
      <div class="legend" id="legend"></div>
    </div>
  </div>
</main>

<script>
const NODES = [
  ["battle", "战斗", "--n-battle"], ["elite", "精英战", "--n-elite"], ["boss", "首领", "--n-boss"],
  ["rest", "休息", "--n-rest"], ["shop", "商店", "--n-shop"], ["smith", "工匠", "--n-smith"],
  ["clinic", "诊所", "--n-clinic"], ["check", "检定事件", "--n-check"], ["ambush", "遭遇 / 未知", "--n-ambush"],
  ["start", "出发", "--cyan"]
];
const ELEMS = [
  ["fire", "火", "--fire"], ["acid", "酸", "--acid"], ["electric", "电", "--electric"], ["ice", "冰", "--ice"],
  ["energy", "能量", "--energy"], ["physical", "物理", "--physical"], ["harmonic", "谐波", "--harmonic"]
];
const icon = (id, cls) => `<svg class="ic ${cls || ""}" viewBox="0 0 48 48" aria-hidden="true"><use href="#${id}"/></svg>`;
const fill = (el, list, prefix, tile) => {
  document.getElementById(el).innerHTML = list.map(([k, name, c]) =>
    `<div class="cell"><div class="${tile}" style="--c:var(${c})">${icon(prefix + k)}</div><b>${name}</b>${k}</div>`).join("");
};
fill("a-nodes", NODES, "n-", "a-tile");
fill("a-elems", ELEMS, "e-", "a-tile");
fill("b-nodes", NODES, "n-", "b-tile");
fill("b-elems", ELEMS, "e-", "b-tile");

document.getElementById("sizes").innerHTML = [16, 20, 24, 32].map(px =>
  `<div><div class="row">${ELEMS.map(([k, , c]) =>
    `<svg class="ic" viewBox="0 0 48 48" width="${px}" height="${px}" style="--c:var(${c});color:var(${c})"><use href="#e-${k}"/></svg>`).join("")}</div>
   <div class="lab">${px}px</div></div>`).join("");

document.getElementById("legend").innerHTML = NODES.map(([k, name, c]) =>
  `<div style="--c:var(${c})">${icon("n-" + k)}<b>${name}</b></div>`).join("");

/* 路线图：从下往上 7 层，最上面是首领 */
const L = [
  [["start", 200]],
  [["battle", 110], ["battle", 200], ["check", 290]],
  [["shop", 80], ["elite", 180], ["battle", 300]],
  [["rest", 120], ["battle", 230], ["smith", 320]],
  [["battle", 90], ["ambush", 200], ["clinic", 300]],
  [["elite", 140], ["rest", 260]],
  [["boss", 200]]
];
const links = [
  [[0, 0], [1, 0]], [[0, 0], [1, 1]], [[0, 0], [1, 2]],
  [[1, 0], [2, 0]], [[1, 1], [2, 1]], [[1, 1], [2, 0]], [[1, 2], [2, 2]],
  [[2, 0], [3, 0]], [[2, 1], [3, 0]], [[2, 1], [3, 1]], [[2, 2], [3, 2]],
  [[3, 0], [4, 0]], [[3, 0], [4, 1]], [[3, 1], [4, 1]], [[3, 2], [4, 2]],
  [[4, 0], [5, 0]], [[4, 1], [5, 0]], [[4, 1], [5, 1]], [[4, 2], [5, 1]],
  [[5, 0], [6, 0]], [[5, 1], [6, 0]]
];
const path = [[0, 0], [1, 1], [2, 1]];       // 走过的路
const now = [2, 1];                           // 当前在精英战
const colorOf = (k) => (NODES.find(n => n[0] === k) || [])[2];
const y = (row) => 560 - row * 85;
const pos = ([r, i]) => [L[r][i][1], y(r)];
const same = (a, b) => a[0] === b[0] && a[1] === b[1];
const onPath = (a) => path.some(p => same(p, a));
let svg = "";
links.forEach(([a, b]) => {
  const [x1, y1] = pos(a), [x2, y2] = pos(b);
  const cls = onPath(a) && onPath(b) ? "done" : same(a, now) ? "next" : "";
  svg += `<path class="edge ${cls}" d="M${x1} ${y1} C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2}"/>`;
});
L.forEach((row, r) => row.forEach(([k, x], i) => {
  const here = [r, i];
  const state = same(here, now) ? "now" : onPath(here) ? "done" : "later";
  const big = k === "boss" ? 30 : 22;
  const ring = k === "boss"
    ? `<path class="ring" d="M${x} ${y(r) - 34} L${x + 30} ${y(r) - 17} L${x + 30} ${y(r) + 17} L${x} ${y(r) + 34} L${x - 30} ${y(r) + 17} L${x - 30} ${y(r) - 17} Z"/>`
    : `<rect class="ring" x="${x - big}" y="${y(r) - big}" width="${big * 2}" height="${big * 2}" transform="rotate(45 ${x} ${y(r)})"/>`;
  const pulse = state === "now" ? `<g transform="rotate(45 ${x} ${y(r)})"><rect class="pulse" x="${x - big}" y="${y(r) - big}" width="${big * 2}" height="${big * 2}"/></g>` : "";
  const s = k === "boss" ? 38 : 30;
  svg += `<g class="node ${state}" style="--c:var(${colorOf(k)})">${pulse}${ring}
    <svg class="ic" x="${x - s / 2}" y="${y(r) - s / 2}" width="${s}" height="${s}" viewBox="0 0 48 48"><use href="#n-${k}"/></svg></g>`;
}));
svg += `<text class="label" x="16" y="26">ACT 1 · 外城区</text><text class="label" x="16" y="586">START</text>`;
document.getElementById("map").innerHTML = svg;
</script>
</body>
</html>
