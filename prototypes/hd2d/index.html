<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 喷漆：边缘被噪点打毛（同 art/style-guide.html） -->
    <filter id="spray" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation=".6"/>
    </filter>
  </defs>
</svg>

<div id="stage"></div>

<header id="topbar">
  <span class="brand">BACKFIRE · HD-2D</span>
  <div class="info">
    <span class="tape hz">回合 <b id="tb-turn">1</b></span>
    <span class="tape">天气 <b id="tb-weather">—</b></span>
    <span class="map" id="tb-map"></span>
    <span class="compact" id="tb-compact"></span>
  </div>
  <!-- 三段镜头：每个人自己的视角（不写进战斗状态，不同步给别人） -->
  <div class="cam" id="cam-bar" role="group" aria-label="镜头：远景 / 中景 / 近景">
    <span class="cam-l">镜头</span>
    <button class="cam-b on" id="cam-far" aria-pressed="true" title="远景：整个战场（键盘 1，滚轮往后滚）">远</button>
    <button class="cam-b" id="cam-mid" aria-pressed="false" title="中景：选中的区和相连的区（键盘 2）">中</button>
    <button class="cam-b" id="cam-near" aria-pressed="false" title="近景：只看选中的那一个区，铭牌放大（键盘 3，滚轮往前滚）">近</button>
    <span class="cam-z" id="cam-zone" title="选中的区：点地台或者铭牌换；中景 / 近景里左右键换相邻的区"></span>
  </div>
  <select id="demo-select" aria-label="切换演示战场"></select>
  <select id="region-select" aria-label="切换区域（地面、远景、灯跟着变）" title="这场战斗在哪个区域：地面、远景、灯跟着变（也可以在网址后面加 ?region=沙漠）"></select>
  <button class="toggle" id="demo-btn" aria-label="切换演示战场">换场</button>
</header>

<aside id="party" class="panel collapsed">
  <div class="head"><button class="toggle" id="party-toggle" aria-expanded="false">队伍</button><span class="tape">我方队伍</span></div>
  <div class="list" id="party-list"></div>
</aside>

<aside id="logdrawer" class="panel collapsed">
  <div class="head"><button class="toggle" id="log-toggle" aria-expanded="false">日志</button><span class="tape pk">战斗日志</span></div>
  <div class="body" id="log-body"></div>
</aside>

<footer id="dock" class="panel collapsed">
  <div class="row">
    <button class="toggle" id="dock-toggle" aria-expanded="false">技能 ▲</button>
    <span class="who" id="dock-who"></span>
    <span class="grow"></span>
    <span class="hint" id="dock-hint">原型：「演示出招」用规则结算一次普通攻击，画面只按联机玩家收到的包播放</span>
    <button class="btn alt" id="demo-strike" title="房主用规则结算一次普通攻击（当前行动的人；够不着就换我方别人），投影成联机玩家收到的包，再按包播攻击演出和伤害数字">演示出招</button>
  </div>
  <div id="skills"></div>
</footer>

<!-- 中景 / 近景：换到相邻的区（键盘左右键也行） -->
<button class="zone-nav prev" id="zone-prev" hidden aria-label="看前一个区（←）"></button>
<button class="zone-nav next" id="zone-next" hidden aria-label="看后一个区（→）"></button>

<div id="toast"></div>
<div id="loading">载入战场……</div>

<div id="calc-core" hidden>
  <!-- 旧计算器的元素：app.js 的 syncBladeSel 会逐个改 bladeSel 的 options，替身 div 没有 options 会报错，所以这个照 game.html 放真的下拉框 -->
  <select id="bladeSel"><option value="niu">丹生谷（火）</option><option value="naruto">鳴門（冰）</option></select>
</div>
<script>
/* 垫片（照 game.html 的做法）：app.js 在有页面时会自己跑 init()，去找旧计算器的 presetSelect、zoneMode、partySize 等一大批元素，
 * 这个原型页面里没有，找不到就会报 Cannot set properties of null。这里让「不认识的 id」拿到一个藏起来的替身（div），
 * 原型自己的元素（OWN 里逐个列出的 id，整个匹配，不按前缀——以前按前缀，partySize 被 party 拦下拿到 null）照实返回，
 * 不被替身骗过。也不让计算器读写它自己的存档。不改 app.js。 */
window.GAME_MODE = true;
(function () {
  var add = window.addEventListener.bind(window);
  window.addEventListener = function (type, fn, opt) {
    if (type === "beforeunload") return;
    return add(type, fn, opt);
  };
  var gi = Storage.prototype.getItem, si = Storage.prototype.setItem;
  function calcKey(k) { return k === "anterscale-calc" || k === "anterscale-roster"; }
  Storage.prototype.getItem = function (k) { return calcKey(String(k)) ? null : gi.call(this, k); };
  Storage.prototype.setItem = function (k, v) { if (calcKey(String(k))) return; return si.call(this, k, v); };
  var byId = Document.prototype.getElementById;
  var OWN = /^(?:stage|topbar|tb-turn|tb-weather|tb-map|tb-compact|cam-bar|cam-far|cam-mid|cam-near|cam-zone|demo-select|region-select|demo-btn|party|party-toggle|party-list|logdrawer|log-toggle|log-body|dock|dock-toggle|dock-who|dock-hint|demo-strike|hd2d-pop|skills|zone-prev|zone-next|toast|loading|calc-core)$/;
  Document.prototype.getElementById = function (id) {
    var e = byId.call(this, id);
    if (e || OWN.test(String(id))) return e;
    var core = byId.call(this, "calc-core");
    if (!core) return e;
    e = document.createElement("div");
    e.id = id;
    core.appendChild(e);
    return e;
  };
})();
</script>

<script>
/* 规则文件在浏览器里加载，会带着「去写正式页面元素」的界面函数（renderAll、renderZones……）。
 * 这个原型只拿规则算数据，页面上没有那些元素，所以把 render 开头的界面函数换成空的。
 * 规则函数本身一个都不动；没有页面时它们本来就是这样被跳过的（app.js 的 HAS_DOM）。 */
(function () {
  Object.keys(window).forEach(function (k) {
    if (/^render[A-Z]/.test(k) && typeof window[k] === "function") window[k] = function () {};
  });
  window.addEventListener("error", function (e) {
    var t = document.getElementById("toast");
    t.textContent = "出错了：" + (e.message || e.error) + (e.filename ? "\n" + e.filename.split("/").pop() + ":" + e.lineno : "");
    t.classList.add("show");
  });
})();
</script>

<script type="module">
import { createHd2dScene } from "./hd2d-scene.js";

const L = window.HD2DLayout;
const CAMS = window.HD2DCamera;
const $ = (id) => document.getElementById(id);

/* ---------- 演示战场（用真规则 BattleSim.setup 生成，再补上场地 / 间隔 / 状态） ---------- */
const PARTY = ["kolt", "helu", "ruby", "yuito"];
const gap = (type, hp, open) => ({ type, hp: hp || 0, maxHp: hp || 0, open: open !== false, lastFrom: null });
/** 把某个单位的血削掉一部分（从最外层开始扣），让血条有高低 */
function hurt(st, kit, frac) {
  const u = st.units.find(x => x.kit === kit && !x.dead);
  if (!u) return;
  let left = Math.round(u.layers.reduce((a, l) => a + l.max, 0) * frac);
  for (let i = 0; i < u.layers.length && left > 0; i++) { const d = Math.min(left, u.layers[i].current); u.layers[i].current -= d; left -= d; }
}
const unit = (st, kit) => st.units.find(x => x.kit === kit);

/* region：这场战斗默认在哪个区域（游戏里的区域名，hd2d-layout.js 的 REGIONS）。默认地台的地面、远景、灯都跟着它；顶栏的区域下拉框 / ?region= 可以换。
 * theme：光影主题（白天 / 傍晚 / 夜晚）。
 * 两个都当成「布置战场」写进战斗状态（BattleSim.setup 的 region / light，和战斗原型的遭遇一样：world-data.js · battleLookStart），
 * 画面读投影里的 pv.region / pv.light（online-view.js 的白名单放行），和联机玩家拿到的一样 */
const DEMOS = [
  {
    id: "mine", name: "三区直排 · 晴天", region: "第一采矿场", theme: "dusk",
    make(region) {
      const st = BattleSim.setup({
        party: PARTY, zoneMode: 3, seed: "hd2d-mine", region, light: this.theme,
        enemies: [{ id: "guard_sword", lv: 2, zone: 3 }, { id: "guard_gun", lv: 2, zone: 3 }, { id: "thug_hammer", lv: 2, zone: 2 }, { id: "boomcar", lv: 2, zone: 2 }]
      });
      st.fields[2].acid = true;
      st.fields[3].highland = true;
      st.gaps["1-2"] = gap("bridge", 12);
      st.gaps["2-3"] = gap("wall", 20, false);
      st.gaps["1-2"].hp = 8;
      hurt(st, "kolt", 0.3); hurt(st, "guard_sword", 0.4); hurt(st, "thug_hammer", 0.2);
      unit(st, "kolt").statuses.burn = 2; unit(st, "guard_gun").statuses.shock = true; unit(st, "ruby").def -= 1;
      return st;
    }
  },
  {
    id: "desert", name: "2×2 · 沙暴", region: "沙漠", theme: "day",
    make(region) {
      const st = BattleSim.setup({
        party: PARTY, board: "square4", weather: "sand", seed: "hd2d-desert", region, light: this.theme,
        enemies: [{ id: "sandfish_ambush", lv: 2, zone: 1 }, { id: "sandfish_lead", lv: 2, zone: 2 }, { id: "sand_beast", lv: 2, zone: 4 }, { id: "sand_human", lv: 2, zone: 4 }]
      });
      st.fields[1].quicksand = true;
      st.fields[4].coral = true;
      st.gaps["1-3"] = gap("void");
      st.gaps["2-4"] = gap("bridge", 10);
      const shark = unit(st, "sandfish_ambush");
      if (shark) shark.submerged = true;          // 沙鱼潜在流沙下面，只露半截
      hurt(st, "sand_beast", 0.35); hurt(st, "ruby", 0.25);
      unit(st, "sand_human").statuses.corr = true; unit(st, "helu").statuses.inspire = true;
      return st;
    }
  },
  {
    id: "cross", name: "十字五区 · 夜晚 · 雷鸣", region: "外城区", theme: "night",
    make(region) {
      const st = BattleSim.setup({
        party: PARTY, board: "cross5", weather: "thunder", seed: "hd2d-cross", region, light: this.theme,
        enemies: [{ id: "crow", lv: 2, zone: 1 }, { id: "buoy", lv: 2, zone: 1 }, { id: "thug_hammer", lv: 2, zone: 3 }, { id: "guard_gun", lv: 2, zone: 4 }]
      });
      st.fields[1].abyss = true;
      st.fields[2].highland = true;
      st.fields[3].electric = true;
      st.fields[4].acid = true;
      st.gaps["1-3"] = gap("void");
      st.gaps["2-3"] = gap("door", 0, false);
      st.gaps["3-4"] = gap("bridge", 12);
      hurt(st, "buoy", 0.3); hurt(st, "thug_hammer", 0.15); hurt(st, "yuito", 0.4);
      unit(st, "buoy").statuses.shock = true; unit(st, "guard_gun").stunned = true;
      return st;
    }
  }
];

/* ---------- 状态 ----------
 * st = 房主那边的完整战斗状态（规则用）；pv = 联机玩家拿到的那一份：st 过一遍 online-view.js 的白名单（projectState）。
 * 画面（布局、场景、顶栏、队伍栏）只用 pv：和联机玩家看到的一模一样，没有坚毅生命、没有藏起来的单位 */
let sc = null, demo = null, st = null, pv = null, actorId = null, camInfo = null;
function project() {
  pv = OnlineView.projectState(st, { itemCatalog: typeof ITEM_CATALOG !== "undefined" ? ITEM_CATALOG : {} });
  return pv;
}
/** 区域：页面选的 = 顶栏下拉框 / 网址的 ?region= 选的（区域名、地图地点 id，或者认不得的名字 = 看兜底的样子）；null = 按演示默认的。
 *  页面选的当成这场战斗原型的区域写进战斗状态（BattleSim.setup / battleLookStart 的 region），
 *  画面读投影里的 pv.region（主机认得的区域名才发）；投影里没有（认不得的名字）再用页面选的兜底。不从房主的原始 state 读 */
let regionPick = null;
const pageRegion = () => (regionPick != null ? regionPick : demo.region);
const regionNow = () => (pv && pv.region) || pageRegion();
/** 光影主题：投影里的 pv.light（演示定的写进了战斗状态：BattleSim.setup 的 light）；没有再用演示的 */
const themeNow = () => (pv && pv.light) || demo.theme;
const weatherText = (w) => (!w || w === "none") ? "晴天" : (typeof weatherName === "function" ? weatherName(w) : w);

/** 排战场：铭牌是固定像素大小的 DOM，所以把真实的画面大小和上下被面板盖住的像素交给布局，它按同一个镜头算站位；
 *  区域（地面、远景、灯）和光影主题（灯白天 / 夜里几盏）也交给布局。交给布局的是投影过的状态（先投影，区域、光影再读投影里的） */
function build() {
  if (!st || !sc) return null;
  return L.build(project(), { portrait: !!sc.portrait, view: sc.view(), region: regionNow(), theme: themeNow() });
}
function repaint(resetView) {
  const layout = build();
  if (!layout) return;
  sc.setBattle(layout, { weather: pv.weather, theme: themeNow(), actorId });
  if (resetView) sc.refit();
  renderUI(layout);
}

/* ---------- 界面 ---------- */
function players() { return (pv ? pv.units : []).filter(u => u.isPlayer && !u.hidden && !u.dead && !u.weaponOf); }
function renderUI(layout) {
  const place = layout.region || "未知区域";
  $("tb-turn").textContent = pv.turnNo || 1;
  $("tb-weather").textContent = weatherText(pv.weather);
  $("tb-map").textContent = place + " · " + demo.name;
  // 手机上的精简顶栏：R1 · 晴 · 第一采矿场
  const wt = weatherText(pv.weather);
  $("tb-compact").textContent = "R" + (pv.turnNo || 1) + " · " + wt.replace(/天$/, "") + " · " + place;
  // 队伍栏：只用铭牌数据（没有坚毅生命）
  const plates = {};
  layout.units.forEach(u => { plates[u.id] = u.plate; });
  $("party-list").innerHTML = players().map(u => {
    const p = plates[u.id]; if (!p) return "";
    const segs = p.layers.slice().reverse().map(l => `<i style="width:${p.hp.max ? 100 * l.max / p.hp.max : 0}%;background:linear-gradient(90deg,${LAYER[l.type] || "#d8574a"} ${l.max ? 100 * l.cur / l.max : 0}%,#2a2520 0)"></i>`).join("");
    return `<div class="pm ${u.id === actorId ? "on" : ""}" data-id="${u.id}"><span class="face">${esc(p.name.slice(0, 1))}</span>
      <div class="meta"><div class="nm">${esc(p.name)} <span class="lv">Lv${p.level}</span></div><div class="bar">${segs}</div></div></div>`;
  }).join("");
  document.querySelectorAll(".pm").forEach(el => el.addEventListener("click", () => setActor(el.dataset.id)));
  renderSkills();
  renderLog();
}
const LAYER = { flesh: "#d8574a", armor: "#9aa7b3", shield: "#4fb8ff", sand: "#d1a85a", spirit: "#c07cf0" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function setActor(id) {
  actorId = id;
  sc.setActor(id);
  document.querySelectorAll(".pm").forEach(el => el.classList.toggle("on", el.dataset.id === id));
  renderSkills();
}
function renderSkills() {
  const v = pv && pv.units.find(x => x.id === actorId);   // 名字、等级：投影里的
  $("dock-who").innerHTML = v ? `${esc(v.name)}<small>Lv${v.level} · 行动中</small>` : "";
  // 技能名：原型的占位，用规则里的技能表（房主本机）。联机时玩家的技能菜单由房主按 online-view.js · projectActionMenu 另发，第二阶段接出招时再换
  const u = st.units.find(x => x.id === actorId);
  let list = [];
  try { list = typeof skillList === "function" && u ? skillList(u) : []; } catch (e) { list = []; }
  if (!list.length) list = [{ name: "普通攻击", hint: "（原型占位）" }, { name: "移动", hint: "（原型占位）" }, { name: "防御", hint: "（原型占位）" }];
  const colors = ["", "mint", "alt", "pink"];
  $("skills").innerHTML = list.slice(0, 12).map((s, i) => `<button class="btn ${colors[i % colors.length]}" title="${esc(s.hint || "")}">${esc(s.name)}</button>`).join("");
  $("skills").querySelectorAll(".btn").forEach(b => b.addEventListener("click", () => toast("技能按钮还是摆设：点右边的「演示出招」，看规则结算的一次普通攻击")));
}
/** 日志：联机玩家看的是房主发的公开日志（online-view.js · projectLogs 的白名单，不是规则的原始日志）。
 *  publicLogs 是房主这边开场的（原型没有）；packetLogs 是「演示出招」收到的包里投影好的公开日志（packet.publicLogs） */
const publicLogs = [];
let packetLogs = [];
function renderLog() {
  const lines = OnlineView.projectLogs(publicLogs).concat(packetLogs).map(l => l.text).filter(Boolean);
  $("log-body").innerHTML = (lines.length ? lines : ["（战斗还没开始，日志是空的）"]).map(t => `<p>${esc(t)}</p>`).join("") +
    `<p class="dim">—— 原型：这里显示联机玩家看得到的公开日志（「演示出招」收到的包里的）。</p>`;
}

/* ---------- 演示出招（第二阶段 · 二，#230）----------
 * 房主那边：HD2DHost.strike 用规则结算一次普通攻击（当前行动的人；够不着就换我方别人），拼成联机的结果包，
 * 过一遍 online-view.js 的白名单（OnlineView.projectPacket）= 联机玩家收到的那一份。
 * 画面这边：HD2DPlay.play 只拿这个包播（attack-fx 的出手 / 弹道 / 打中 + HitFx 受击粒子 + 纸片风伤害数字），
 * 位置问适配器（HD2DFx.adapter：3D 铭牌投影到屏幕上，镜头动了跟着变）；打中的那一刻铭牌换成包里的 state。不读房主的 st */
let striking = false, strikeN = 0;
function fxAdapter() {
  return HD2DFx.adapter({ lens: () => sc.lensNow(), plate: (id) => sc.plateOf(id), zone: (id) => sc.zoneOf(id), size: (big) => L.plateSize(sc.view(), big) });
}
/** 画面换成包里的那一份（packet.state：房主投影好发来的），和联机玩家一样 */
function showPacket(packet) {
  pv = packet.state;
  const layout = L.build(pv, { portrait: !!sc.portrait, view: sc.view(), region: regionNow(), theme: themeNow() });
  sc.setBattle(layout, { weather: pv.weather, theme: themeNow(), actorId });
  renderUI(layout);
}
async function demoStrike() {
  if (striking || !st || !sc) return;
  const env = { G: window, state: st, BattleSim, OnlineView, AttackFx, itemCatalog: typeof ITEM_CATALOG !== "undefined" ? ITEM_CATALOG : {} };
  const before = pv;
  let packet = null;
  try { packet = HD2DHost.strike(env, { actorId, pick: strikeN, seq: strikeN }); } catch (e) { console.error(e); toast("结算出错：" + e.message); return; }
  if (!packet) { toast("我方谁都够不着敌人（或者敌人都倒下了）"); return; }
  strikeN++;
  packetLogs = packetLogs.concat(packet.publicLogs || []);
  striking = true; $("demo-strike").disabled = true;
  try {
    await HD2DPlay.play(packet, fxAdapter(), {
      before, bigHit: typeof bigHitInfo === "function" ? bigHitInfo : null, view: () => sc.view(), onImpact: () => showPacket(packet)
    });
  } catch (e) { console.error(e); } finally { striking = false; $("demo-strike").disabled = false; }
}
let toastTimer = 0;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.background = "var(--steel)"; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* 面板收起 / 展开 */
function wirePanel(panelId, btnId, labelOn, labelOff, startOpen) {
  const p = $(panelId), b = $(btnId);
  const set = (open) => {
    p.classList.toggle("collapsed", !open);
    b.setAttribute("aria-expanded", String(open));
    if (labelOn) b.textContent = open ? labelOn : labelOff;
    if (panelId === "dock") reinset(true);
  };
  b.addEventListener("click", () => set(p.classList.contains("collapsed")));
  set(startOpen);
}
/** 取景时让开顶栏和底部技能栏；让开的大小变了，铭牌的站位也跟着重排 */
function reinset(refit) {
  if (!sc) return;
  const top = $("topbar").offsetHeight;
  const bottom = $("dock").offsetHeight;
  sc.setInsets({ top: top + 6, bottom: bottom + 4 });
  repaint(refit);
}

/* ---------- 镜头（远景 / 中景 / 近景看单个区域）----------
 * 每个人自己的视角：只动这边的画面，不写进战斗状态（st / pv），也不发给别人。按钮、键盘 1 / 2 / 3、滚轮（场景里）切；
 * 点地台或者铭牌选区（场景里）；中景 / 近景里左右键、屏幕两边的箭头换到相邻的区 */
function syncCamera(info) {
  camInfo = info;
  CAMS.CAMERA.order.forEach(t => { const b = $("cam-" + t); b.classList.toggle("on", info.tier === t); b.setAttribute("aria-pressed", String(info.tier === t)); });
  $("cam-zone").textContent = info.tag || "";
  const nav = info.tier !== "far";
  [["zone-prev", info.prev, "◀ " + info.prevTag], ["zone-next", info.next, info.nextTag + " ▶"]].forEach(([id, zone, text]) => {
    const b = $(id);
    b.hidden = !nav || zone == null;
    b.textContent = text;
  });
  syncUrl();
}
function onKey(e) {
  if (!sc || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target, tag = t && t.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || (t && t.isContentEditable)) return;
  const K = CAMS.CAMERA.keys, tier = CAMS.CAMERA.order.find(x => K[x] === e.key);
  if (tier) { e.preventDefault(); sc.setTier(tier); return; }
  if ((e.key === K.prev || e.key === K.next) && sc.tier !== "far") { e.preventDefault(); sc.stepZone(e.key === K.prev ? -1 : 1); }
}

/* ---------- 启动 ---------- */
function loadDemo(id) {
  demo = DEMOS.find(d => d.id === id) || DEMOS[0];
  st = demo.make(pageRegion());
  strikeN = 0; packetLogs = [];
  if (window.HD2DPlay) HD2DPlay.clear();
  project();
  const p = players();
  actorId = p.length ? p[0].id : null;
  $("demo-select").value = demo.id;
  syncRegion();
  repaint(true);
}
/** 区域下拉框：「按演示」（显示演示默认的区域）、配置表里的每个区域、「认不得的区域」（看兜底的样子）。网址跟着改，截图时复制网址就能回到同一个画面 */
const UNKNOWN = "?";
function syncRegion() {
  const sel = $("region-select");
  sel.options[0].textContent = "区域：按演示（" + demo.region + "）";
  sel.value = regionPick == null ? "" : L.regionName(regionPick) || UNKNOWN;
  syncUrl();
}
/** 网址：演示战场、区域、镜头（?cam=mid / near）和看的那个区（?zone=3）。复制网址就能回到同一个画面（截图用） */
function syncUrl() {
  if (!demo) return;
  const q = new URLSearchParams(location.search);
  q.set("demo", demo.id);
  if (regionPick == null) q.delete("region"); else q.set("region", regionPick);
  if (camInfo && camInfo.tier !== "far") { q.set("cam", camInfo.tier); q.set("zone", camInfo.zone); } else { q.delete("cam"); q.delete("zone"); }
  try { history.replaceState(null, "", location.pathname + "?" + q.toString()); } catch (e) { /* 打不开 history（例如本地文件）就算了 */ }
}
function boot() {
  const phone = window.matchMedia("(max-width: 720px)").matches;
  wirePanel("dock", "dock-toggle", "技能 ▼", "技能 ▲", !phone);
  wirePanel("party", "party-toggle", "队伍 ◀", "队伍 ▶", !phone);
  wirePanel("logdrawer", "log-toggle", "日志 ▶", "日志 ◀", false);
  $("demo-select").innerHTML = DEMOS.map(d => `<option value="${d.id}">${esc(d.region + " · " + d.name)}</option>`).join("");
  $("demo-select").addEventListener("change", e => loadDemo(e.target.value));
  $("demo-btn").addEventListener("click", () => loadDemo(DEMOS[(DEMOS.indexOf(demo) + 1) % DEMOS.length].id));   // 手机：小按钮轮流切
  $("region-select").innerHTML = `<option value="">区域：按演示</option>` + Object.keys(L.REGIONS).map(n => `<option value="${esc(n)}">区域：${esc(n)}</option>`).join("") +
    `<option value="${UNKNOWN}">区域：认不得（兜底）</option>`;
  // 换区域：和开战时一样写进战斗状态（battleLookStart），画面再读投影里的
  $("region-select").addEventListener("change", e => { regionPick = e.target.value || null; battleLookStart({ region: pageRegion(), light: demo.theme }); syncRegion(); repaint(true); });
  const params = new URLSearchParams(location.search);
  regionPick = params.get("region") || null;      // ?region=沙漠 / ?region=mine_1（地图地点 id 也认）
  sc = createHd2dScene($("stage"), {
    camera: { tier: params.get("cam"), zone: params.get("zone") },   // ?cam=near&zone=3：开场就是近景看 3 区
    onCameraChange: syncCamera,
    onPortraitChange() { if (sc && st) repaint(true); },
    onViewChange() { if (sc && st) reinset(true); }      // 窗口大小变了：按新画面重排铭牌、镜头回到这一段的位置
  });
  CAMS.CAMERA.order.forEach(t => $("cam-" + t).addEventListener("click", () => sc.setTier(t)));
  $("zone-prev").addEventListener("click", () => sc.stepZone(-1));
  $("zone-next").addEventListener("click", () => sc.stepZone(1));
  $("demo-strike").addEventListener("click", demoStrike);
  window.addEventListener("keydown", onKey);
  reinset(false);
  loadDemo(params.get("demo") || DEMOS[0].id);
  $("loading").classList.add("done");
  window.HD2D = { sc, DEMOS, L, CAMS, strike: demoStrike, get state() { return st; }, get view() { return pv; } };   // 方便在控制台里看（state 是房主的完整状态，view 是画面用的投影）
}
try { boot(); } catch (e) {
  $("loading").classList.add("done");
  const t = $("toast"); t.textContent = "原型启动失败：" + e.message; t.classList.add("show");
  console.error(e);
}
</script>
</body>
